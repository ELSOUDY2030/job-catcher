# Job Catcher settings. Edit this file, not the code.

hours_old = 24  # default: only jobs posted in the last N hours
max_messages_per_run = 40  # mode "each" only: best-scored first, the rest wait for the next run
digest_hour_utc = 7  # mode "each" only: daily digest at 07 UTC = 9 AM Cairo (winter)

[telegram]
# "summary" = ONE message every summary_minutes: what was applied to, what wasn't and why, the best
#             jobs left (with 🚀 buttons). "each" = one message per job (the old way, floods the chat).
mode = "summary"
summary_minutes = 60

[apply]  # done on YOUR PC by pc/pc_runner.py (Antigravity + the job-hunter skill), every 30 minutes
auto_min_score = 8   # jobs scoring this or more are queued automatically (🤖); the rest get a 🚀 button
per_cycle = 4        # max applications per 30-minute PC cycle (= 8/hour, the job-hunter skill's pace)
claude_review = true # answers the rule check can't verify are reviewed by `claude -p` before Submit
use_claude = false  # false: the CV and the answer review run on Gemini (agy) too, no Claude Code tokens
cv_model = "claude-sonnet-5-5"  # makes the next job's CV while agy applies (pc/cv_maker.py); "" = ready CVs only
agy_model = "gemini-4-hydrogen-medium"  # Antigravity model for applying (`agy models` lists them)
agy_fallback = ["gemini-4-hydrogen-high", "gemini-4-hydrogen-low"]  # used when the model above has no capacity
# Antigravity runs Gemini Hydrogen only (user, 13 Nov 2026): Argon, Dragon, Flash 3.8 and claude-* are blocked in pc_runner.BLOCKED_MODELS
sonnet_submit = true  # Hydrogen's final click didn't confirm (not a CAPTCHA): Sonnet (`claude -p` + the same Playwright MCP) clicks it
trigger_github = true # the PC starts the GitHub run every 30 min (GitHub's own schedule skips most runs)
ask_minutes = 30  # a question not in your facts goes to Telegram with a suggested answer; wait this long
notify_each = false  # false: results only in the hourly summary (screenshots stay in receipts/<id>/ on your PC)
                     # true: also a Telegram message per application, with the screenshot + questions/answers
# last check on the PC before Antigravity starts: queued jobs whose title has one of these are skipped
# (not plain "stage": it would also skip "early-stage startup" titles)
skip_titles = ["intern", "internship", "stage -", "stage ingénieur", "stage data", "stagiaire", "bac+5",
               "alternance", "praktikum", "werkstudent", "prácticas", "becario", "tirocinio", "trainee", "apprenticeship", "apprentice"]

[filter]
# The job TITLE must contain one of these (whole word, any case).
include = [
  "ai", "ml", "mlops", "llm", "llms", "nlp", "genai", "generative",
  "machine learning", "deep learning", "data scientist", "data science",
  "computer vision", "artificial intelligence", "ذكاء اصطناعي",
]
# ...and none of these. More examples: "intern", "internship", "sales"
exclude = ["marketing", "media buying"]

[score]
# Match score 0-10 shown as ⭐ on every job. Built from candidate_facts.md (approved skills = +,
# "DO NOT CLAIM" list = -). Title hit counts double, description hit once.
full_marks = 10            # raw points that make a 10/10
description_cap = 4        # a description can add at most this (long ones mention everything)
my_years = 5               # jobs asking for more than my_years + 1 years lose points
too_many_years_penalty = 4
min_score = 4              # don't send jobs below this (0 = everything). 2026-11-10: 63/238 sent jobs scored 0-3
                           # (mostly just "AI" in a title), so 4 cuts that noise.

